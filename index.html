    function appendLocationLog(message) {

    function haversineDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

}

async function watchChildLocation(childUid) {
  const q = query(collection(db, 'locations'), where('uid', '==', childUid), orderBy('timestamp', 'desc'), limit(1));
  childListeners[childUid] = onSnapshot(q, (snap) => {
    console.log('🔥 CHILD UPDATE:', childUid, snap.docs[0]?.data());
    if (snap.empty) {
      document.getElementById('child-status').innerHTML = `👦 ${childUid.slice(0,8)}... No location data`;
      return;
    }
    
    const data = snap.docs[0].data();
    const lat = data.lat, lng = data.lng;
    
    if (!childMarkers[childUid]) {
      childMarkers[childUid] = L.marker([lat, lng], {
        icon: L.divIcon({ 
          className: 'child-location', 
          html: `👦<div style="font-size:10px;">${childUid.slice(0,6)}</div>`,

    }
    
    if (linkedChildren[0] === childUid) {
      map.setView([lat, lng], 16);
    }
    
   document.getElementById('child-status').innerHTML = `📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
document.getElementById('child-status').className = 'status ok';
    });
}

    function loadGeofences() {

      renderGeofenceList();

    function renderGeofencesOnMap() {
      if (!map) return;
      geofenceLayers.forEach(layer => map.removeLayer(layer));

      Object.entries(customGeofences).forEach(([key, fence]) => {
        const color = key === 'school' ? '#00ff00' : '#ff4444';
        const layer = L.circle([fence.lat, fence.lng], {
          color, fillColor: color, fillOpacity: 0.4, weight: 4, radius: fence.radius
        }).addTo(map).bindPopup(`${fence.name} (${fence.radius}m)`);
        geofenceLayers.push(layer);
      });
    }

   async function startContinuousTracking() {
  if (watchId) return;
  
  // 🔥 FORCE FRESH GPS - ignore cache
  watchId = navigator.geolocation.watchPosition(
    async (pos) => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      
      // 🔥 DEBUG: Log EVERY position

const schoolDist = haversineDistance(lat, lng, schoolFence.lat, schoolFence.lng);

}

// HOME ZONE
const homeFence = customGeofences.home || homeZone;
const homeDist = haversineDistance(lat, lng, homeFence.lat, homeFence.lng);

if (homeDist <= homeFence.radius) {
  homeInsideCount += 1;
  if (homeInsideCount >= 2 && !isInsideHomeZone) {

} else if (homeDist > homeFence.radius + 20) {
  homeInsideCount = 0;
  if (isInsideHomeZone) {
    isInsideHomeZone = false;
    updateFaceUI();
  }
}

      lastLat = lat;
      lastLng = lng;
      appendLocationLog(`📍 NEW POS: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);

      try {

function updateFaceUI() {
  const faceSection = document.getElementById('face-section');
  const faceBtn = document.getElementById('face-verify-btn');
  const captureBtn = document.getElementById('capture-face-btn');
  const faceStatus = document.getElementById('face-status');

  const zoneActive = isInsideSchoolZone || isInsideHomeZone;

    faceSection.classList.remove('hidden');
    faceBtn.disabled = false;
    captureBtn.disabled = false;
    faceStatus.textContent = isInsideSchoolZone 
      ? '🏫 SCHOOL: Verify face for arrival check-in' 
      : '🏠 HOME: Verify face for departure check-out';
    faceStatus.className = 'status ok';
  } else {
    faceSection.classList.add('hidden');
    faceBtn.disabled = true;
    captureBtn.disabled = true;
    faceStatus.textContent = 'Waiting for zone trigger...';
    faceStatus.className = 'status pending';
    stopFaceCamera();
  }
}

async function startFaceCamera() {
  if (faceStream) return;

  try {
    faceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    facePreview.srcObject = faceStream;
    await facePreview.play();
    appendLocationLog('📷 Camera started');
  } catch (err) {
    appendLocationLog(`❌ Camera error: ${err.message}`);
  }
}

function captureFacePhoto() {
  if (!facePreview.videoWidth || !facePreview.videoHeight) return null;

  faceCanvas.width = facePreview.videoWidth;
  faceCanvas.height = facePreview.videoHeight;
  faceCtx.drawImage(facePreview, 0, 0, faceCanvas.width, faceCanvas.height);

  return faceCanvas.toDataURL('image/jpeg', 0.92);
}

function stopFaceCamera() {
  if (faceStream) {
    faceStream.getTracks().forEach(track => track.stop());
    faceStream = null;
  }

  if (facePreview) {
    facePreview.pause();
    facePreview.srcObject = null;
  }
}

async function verifyFaceWithServer(imageData) {
  const response = await fetch('/api/verify-face', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      image: imageData,
      uid: auth.currentUser?.uid
    })
  });

  if (!response.ok) {
    throw new Error(`Server error: ${response.status}`);
  }

  return await response.json();
}

  await startFaceCamera();
  document.getElementById('face-status').textContent = '📷 Camera ready. Tap Capture & Verify.';
};

window.captureFace = async () => {
  if (faceVerifyInProgress) return;
  faceVerifyInProgress = true;

  try {
    await startFaceCamera();

    const imageData = captureFacePhoto();
    if (!imageData) throw new Error('Camera not ready yet');

    document.getElementById('face-status').textContent = '🔎 Verifying face...';

    const result = await verifyFaceWithServer(imageData);

      if (result.verified) {
  faceCaptured = true;
  verificationPending = false;  // ← ADD THIS
  document.getElementById('face-status').textContent = '✅ Face verified successfully';
  appendLocationLog(isInsideSchoolZone ? '✅ SCHOOL CHECK-IN COMPLETE' : '✅ HOME CHECK-OUT COMPLETE');
  updateFaceUI();  // ← ADD THIS to hide panel
} 
      appendLocationLog('✅ Face verified');
    } else {
      document.getElementById('face-status').textContent = result.message || '❌ Face not recognized';
      appendLocationLog('❌ Face verification failed');
    }
  } catch (err) {
    document.getElementById('face-status').textContent = `❌ ${err.message}`;
    appendLocationLog(`❌ Face capture failed: ${err.message}`);
  } finally {
    faceVerifyInProgress = false;
  }
};
    
    // 🔥 NEW: Student listens for guardian START/STOP commands (with cleanup)
    function watchStudentTrackingCommands(userUid) {
      if (commandUnsubscribe) commandUnsubscribe(); // 🔧 FIX 3: prevent stacking

      const cmdDocRef = doc(db, 'trackingCommands', userUid);
      commandUnsubscribe = onSnapshot(cmdDocRef, (snap) => {
        if (!snap.exists()) return;
        
        const data = snap.data();
        const command = data.command;
        const ts = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString() : 'now';
        
        appendLocationLog(`📩 Guardian command: ${command} @ ${ts}`);

        if (command === 'START') {
          if (!locationPermissionGranted) {
            alert('👆 Guardian says START! Please tap "Request GPS" first.');
            appendLocationLog('⚠️ START command - GPS not ready');
            return;
          }
          window.startTracking();
        } else if (command === 'STOP') {
          window.stopTracking();
        }
      });
    }

    // 🔥 WINDOW FUNCTIONS
    window.requestLocationPermission = () => {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locationPermissionGranted = true;
          gpsIndicatorEl.className = 'gps-indicator gps-ok';
          gpsTextEl.innerHTML = `✅ GPS Ready: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
          startBtnEl.disabled = false;
          appendLocationLog('✅ GPS permission granted');
        },
        (err) => { 
          gpsTextEl.innerHTML = `❌ ${err.message}`; 
          appendLocationLog(`❌ GPS denied: ${err.message}`);
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    };

   window.useMyLocation = () => {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById('geo-lat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('geo-lng').value = pos.coords.longitude.toFixed(6);
      alert('📍 Location set!');
    },
    (err) => {
      alert(`❌ ${err.message}`);
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
};

    window.saveCustomGeofence = () => {
  const type = document.getElementById('geofence-type').value;
  const lat = parseFloat(document.getElementById('geo-lat').value);
  const lng = parseFloat(document.getElementById('geo-lng').value);
  const radius = parseInt(document.getElementById('geo-radius').value, 10);

  if (!Number.isFinite(lat) || lat < -90 || lat > 90) return alert('Invalid latitude');
  if (!Number.isFinite(lng) || lng < -180 || lng > 180) return alert('Invalid longitude');
  if (!Number.isFinite(radius) || radius < 10 || radius > 5000) return alert('Invalid radius');

  customGeofences[type] = {
    lat,
    lng,
    radius,
    name: type === 'school' ? 'School' : 'Home',
    type
  };

  localStorage.setItem(`geofences_${auth.currentUser?.uid || 'default'}`, JSON.stringify(customGeofences));
  renderGeofencesOnMap();
  renderGeofenceList();
  alert(`✅ ${type.toUpperCase()} saved!`);
};

    window.deleteGeofence = (type) => {
      delete customGeofences[type];
      localStorage.setItem(`geofences_${auth.currentUser?.uid || 'default'}`, JSON.stringify(customGeofences));
      renderGeofencesOnMap();
      renderGeofenceList();
    };

    window.register = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'users', userCred.user.uid), { email, role });
      if (role === 'guardian') {
        await setDoc(doc(db, 'guardianChildren', userCred.user.uid), { children: [] }, { merge: true });
      }
      alert('✅ Registered!');
    };

    window.login = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  try {
    console.log('🔐 LOGIN ATTEMPT:', email);
    await signInWithEmailAndPassword(auth, email, password);
    console.log('✅ LOGIN SUCCESS');
  } catch (error) {
    console.error('❌ LOGIN ERROR:', error.code, error.message);
    alert(`❌ Login failed: ${error.message}\nCode: ${error.code}`);
  }
};

    window.linkChild = async () => {
  const email = document.getElementById('child-email').value.trim().toLowerCase();
  if (!email) return alert('Enter child email');

  try {
    const q = query(
      collection(db, 'users'),
      where('email', '==', email),
      where('role', '==', 'student'),
      limit(1)
    );
    const snap = await getDocs(q);
    if (snap.empty) return alert('❌ Student account not found');

    const childUid = snap.docs[0].id;
    const guardianRef = doc(db, 'guardianChildren', auth.currentUser.uid);
    const existingSnap = await getDoc(guardianRef);
    const existingChildren = existingSnap.exists() ? (existingSnap.data().children || []) : [];

    if (existingChildren.includes(childUid)) return alert('⚠️ Child already linked');

    await setDoc(
      guardianRef,
      { children: [...existingChildren, childUid] },
      { merge: true }
    );

    alert(`✅ ${email} linked!`);
  } catch (e) {
    alert('❌ Link failed: ' + e.message);
  }
};

   window.logout = async () => {
  Object.values(childListeners).forEach(unsub => unsub && unsub());
  Object.values(childMarkers).forEach(marker => map?.removeLayer(marker));
  childMarkers = {};
  childListeners = {};

  if (trackingInterval) {
    clearInterval(trackingInterval);
    trackingInterval = null;
  }

  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  if (commandUnsubscribe) {
    commandUnsubscribe();
    commandUnsubscribe = null;
  }

  stopFaceCamera();

  await signOut(auth);
};
    
window.unlinkChild = async (childUid) => {
  if (!confirm('Are you sure you want to unlink this child?')) return;

  const guardianRef = doc(db, 'guardianChildren', auth.currentUser.uid);

  try {
    const snap = await getDoc(guardianRef);
    if (!snap.exists()) return alert('No linked children to unlink.');

    const data = snap.data();
    const currentChildren = data.children || [];
    const updatedChildren = currentChildren.filter(uid => uid !== childUid);

    await setDoc(guardianRef, { children: updatedChildren }, { merge: true });

    // Clean up local listener + marker
    if (childListeners[childUid]) {
      childListeners[childUid]();
      delete childListeners[childUid];
    }
    if (childMarkers[childUid]) {
      map.removeLayer(childMarkers[childUid]);
      delete childMarkers[childUid];
    }

    alert('✅ Child unlinked.');
  } catch (e) {
    alert('❌ Failed to unlink child: ' + e.message);
  }
};
    
 async function watchGuardianDashboard() {
  initMap();
  loadGeofences();
  watchGuardianChildren();

  setTimeout(() => {
    map?.invalidateSize();
  }, 50);
}

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userSnap = await getDoc(doc(db, 'users', user.uid));
        const role = userSnap.data()?.role;
        
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById(role === 'guardian' ? 'guardian-dashboard' : 'student-dashboard').classList.remove('hidden');
        
        if (role === 'guardian') {
          watchGuardianDashboard();
        } else if (role === 'student') {
          watchStudentTrackingCommands(user.uid);
          appendLocationLog('👨‍🎓 Ready for guardian commands');
        }
      } else {
        document.querySelectorAll('[id$="-dashboard"]').forEach(el => el.classList.add('hidden'));
        document.getElementById('auth-screen').classList.remove('hidden');
        if (trackingInterval) {
          clearInterval(trackingInterval);
          trackingInterval = null;
        }
        if (commandUnsubscribe) {
  commandUnsubscribe();
  commandUnsubscribe = null;
}
      }
    });
